<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC Ebnat-Kappel — Vorstand</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { --fcek-blue: #021639; --fcek-blue-light: #0a2a5e; --border: #d7dbe2; --success: #1c7c3f; --error: #c0392b; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f5f7; margin: 0; color: #1a1a1a; }
  .topbar { background: var(--fcek-blue); color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { margin: 0; font-size: 1.1rem; }
  .topbar .sub { font-size: 0.8rem; opacity: 0.75; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .who { font-size: 0.8rem; opacity: 0.85; }
  .wrap { max-width: 1300px; margin: 20px auto; padding: 0 14px 40px; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .stat { background: #fff; border-radius: 10px; padding: 14px 18px; flex: 1; min-width: 130px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .stat .val { font-size: 1.8rem; font-weight: 700; color: var(--fcek-blue); }
  .stat .lbl { font-size: 0.8rem; color: #666; margin-top: 2px; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); padding: 18px; margin-bottom: 18px; overflow-x: auto; }
  .card h2 { margin: 0 0 14px; font-size: 1rem; color: var(--fcek-blue); }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  input[type="text"], select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 0.9rem; }
  input[type="text"]:focus, select:focus { outline: none; border-color: var(--fcek-blue); }
  .btn { padding: 8px 14px; border: none; border-radius: 7px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
  .btn-primary { background: var(--fcek-blue); color: #fff; }
  .btn-primary:hover { background: var(--fcek-blue-light); }
  .btn-sm { padding: 4px 10px; font-size: 0.8rem; }
  .btn-outline { background: #fff; border: 1px solid var(--border); color: #333; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th { background: #f0f2f5; padding: 9px 8px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border); white-space: nowrap; }
  td { padding: 5px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:hover td { background: #f9fafc; }
  .cell-input { width: 100%; min-width: 90px; padding: 5px 6px; font-size: 0.83rem; border: 1px solid transparent; border-radius: 5px; background: transparent; }
  .cell-input:hover { border-color: var(--border); }
  .cell-input:focus { outline: none; border-color: var(--fcek-blue); background: #fff; }
  select.cell-input { min-width: 78px; }
  .col-eintritt .cell-input { min-width: 110px; }
  .col-email .cell-input { min-width: 150px; }
  .loading { text-align: center; padding: 30px; color: #888; }
  .msg { padding: 10px 14px; border-radius: 7px; font-size: 0.88rem; margin-bottom: 12px; display: none; }
  .msg.ok { background: #d1e7dd; color: var(--success); display: block; }
  .msg.err { background: #f8d7da; color: var(--error); display: block; }
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 24px; width: 95%; max-width: 440px; max-height: 90vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 16px; color: var(--fcek-blue); }
  .modal label { display: block; font-size: 0.88rem; font-weight: 600; margin: 10px 0 4px; }
  .modal input, .modal select { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 0.9rem; }
  .modal-footer { display: flex; gap: 10px; margin-top: 18px; }
  .modal-footer button { flex: 1; }

  /* Login-Gate */
  #loginGate { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; text-align: center; padding: 20px; }
  #loginGate h2 { color: var(--fcek-blue); margin-bottom: 0; }
  #loginGate p { color: #666; max-width: 360px; margin-top: 0; }
  #app { display: none; }

  @media(max-width:600px) { table { font-size: 0.78rem; } th, td { padding: 6px 4px; } }
</style>
</head>
<body>

<!-- LOGIN-GATE: sichtbar bis erfolgreicher Google-Login + Admin-Check -->
<div id="loginGate">
  <h2>FC Ebnat-Kappel — Vorstand</h2>
  <p>Bitte mit deinem Google-Konto anmelden. Zugriff nur für hinterlegte Vorstandsmitglieder.</p>
  <div id="googleBtn"></div>
  <div class="msg err" id="loginMsg" style="max-width:360px"></div>
</div>

<!-- APP: erst sichtbar nach erfolgreichem Login -->
<div id="app">
  <div class="topbar">
    <div>
      <h1>FC Ebnat-Kappel — Vorstand</h1>
      <div class="sub">Supporter-Verwaltung</div>
    </div>
    <div class="topbar-right">
      <span class="who" id="whoAmI"></span>
      <button class="btn btn-outline btn-sm" onclick="exportCsv()">CSV Export</button>
      <button class="btn btn-outline btn-sm" onclick="logout()">Abmelden</button>
    </div>
  </div>

  <div class="wrap">
    <div class="msg" id="globalMsg"></div>
    <div class="stats">
      <div class="stat"><div class="val" id="statTotal">–</div><div class="lbl">Mitgliedschaften total</div></div>
      <div class="stat"><div class="val" id="statEinzel">–</div><div class="lbl">Gesamt Einzel</div></div>
      <div class="stat"><div class="val" id="statPaar">–</div><div class="lbl">Gesamt Paar</div></div>
      <div class="stat"><div class="val" id="statPersonen">–</div><div class="lbl">Total Mitglieder (Personen)</div></div>
      <div class="stat"><div class="val" id="statAktiv">–</div><div class="lbl">Aktiv</div></div>
      <div class="stat"><div class="val" id="statBezahlt">–</div>
